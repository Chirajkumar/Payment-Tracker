<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💰 Payment Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -50%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      overflow: hidden;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 25px;
      text-align: center;
    }
    .balance-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 35px;
      border-radius: 24px;
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .balance-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 50px rgba(102, 126, 234, 0.5);
    }
    .balance-box h2 {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .balance-box .amount {
      font-size: 56px;
      font-weight: 800;
      margin-top: 12px;
      letter-spacing: -1px;
    }
    .balance-box .edit-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.25);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    .balance-box .edit-btn:hover {
      background: rgba(255,255,255,0.35);
      border-color: rgba(255,255,255,0.6);
      transform: scale(1.05);
    }
    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .form-row input, .form-row select, .form-row button {
      padding: 14px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 15px;
      flex: 1 1 0;
      min-width: 120px;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    .form-row input {
      background: #f9fafb;
    }
    .form-row input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .form-row button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }
    .form-row button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
    }
    .form-row button:active {
      transform: translateY(0);
    }
    .btn-add {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3) !important;
    }
    .btn-add:hover {
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4) !important;
    }
    .btn-deduct {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3) !important;
    }
    .btn-deduct:hover {
      box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4) !important;
    }
    .history {
      margin-top: 35px;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    #historyList {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding-right: 8px;
    }
    #historyList::-webkit-scrollbar {
      width: 6px;
    }
    #historyList::-webkit-scrollbar-thumb {
      background: #c9cbf0;
      border-radius: 8px;
    }
    #historyList::-webkit-scrollbar-track {
      background: transparent;
    }
    .month-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .month-filter label {
      font-size: 13px;
      font-weight: 700;
      color: #6b7280;
    }
    .month-filter select {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid #d1d5db;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      background: #fff;
      cursor: pointer;
      outline: none;
    }
    .month-filter select:focus {
      border-color: #667eea;
    }
    .monthly-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      border: 1px solid rgba(102, 126, 234, 0.2);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
    }
    .ms-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .ms-label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .ms-total {
      font-size: 17px;
      font-weight: 700;
    }
    .ms-total.add {
      color: #10b981;
    }
    .ms-total.deduct {
      color: #ef4444;
    }
    .ms-total.net {
      color: #667eea;
    }
    .history h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 20px;
      border-bottom: 3px solid #667eea;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      margin-bottom: 10px;
      background: #f9fafb;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      border-left: 4px solid #e5e7eb;
    }
    .transaction:hover {
      background: #f3f4f6;
      border-left-color: #667eea;
      transform: translateX(4px);
    }
    .transaction .desc {
      color: #374151;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .transaction-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1 1 0;
      min-width: 0;
    }
    .transaction .tx-date {
      font-size: 12px;
      color: #9ca3af;
    }
    .transaction .amount {
      font-weight: 700;
      font-size: 16px;
    }
    .transaction .amount.add {
      color: #10b981;
    }
    .transaction .amount.deduct {
      color: #ef4444;
    }
    .transaction .amount.edit {
      color: #667eea;
    }
    .transaction-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .transaction .edit-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .transaction .edit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 40px 20px;
      font-size: 16px;
      font-weight: 500;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .modal-content h2 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 25px;
    }
    .modal-content input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 14px;
      background: #f9fafb;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .modal-content input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .btn-save {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(16, 185, 129, 0.4);
    }
    .btn-cancel {
      background: #e5e7eb;
      color: #374151;
    }
    .btn-cancel:hover {
      background: #d1d5db;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 22px;
        border-radius: 24px;
        max-height: calc(100vh - 24px);
        max-height: calc(100dvh - 24px);
      }
      h1 {
        font-size: 26px;
        margin-bottom: 20px;
      }
      .balance-box {
        padding: 28px 20px;
      }
      .balance-box .amount {
        font-size: 44px;
      }
      .date-time {
        font-size: 13px;
      }
      .history h3 {
        font-size: 17px;
      }
      .modal-content {
        max-width: 90%;
        padding: 30px 24px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .container {
        padding: 16px;
        border-radius: 20px;
        max-height: calc(100vh - 16px);
        max-height: calc(100dvh - 16px);
      }
      h1 {
        font-size: 22px;
        margin-bottom: 16px;
      }
      .date-time {
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 18px;
      }
      .balance-box {
        padding: 24px 16px;
        margin-bottom: 22px;
      }
      .balance-box .amount {
        font-size: 38px;
      }
      .balance-box .edit-btn {
        top: 14px;
        right: 14px;
        padding: 8px 12px;
        font-size: 12px;
      }
      .form-row {
        gap: 8px;
        margin-bottom: 12px;
      }
      .form-row input {
        padding: 12px 14px;
        font-size: 14px;
        min-width: 0;
      }
      .form-row button {
        padding: 13px 10px;
        font-size: 12px;
      }
      .history {
        margin-top: 24px;
      }
      .history h3 {
        font-size: 16px;
        margin-bottom: 14px;
      }
      .month-filter select {
        padding: 9px 10px;
        font-size: 13px;
      }
      .monthly-summary {
        padding: 12px 10px;
        margin-bottom: 14px;
      }
      .ms-label {
        font-size: 10px;
      }
      .ms-total {
        font-size: 14px;
      }
      .transaction {
        padding: 12px;
        font-size: 14px;
      }
      .transaction .amount {
        font-size: 15px;
      }
      .transaction .edit-btn {
        padding: 6px 10px;
        font-size: 11px;
      }
      .transaction-right {
        gap: 8px;
      }
      .modal-content {
        padding: 24px 20px;
      }
      .modal-buttons button {
        padding: 12px 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>💰 Payment Tracker</h1>

  <div class="date-time" id="currentDateTime" style="display: none;"></div>

  <div class="balance-box">
    <button class="edit-btn" id="editBalanceBtn">✏️ Edit</button>
    <h2>Current Balance</h2>
    <div class="amount" id="balanceDisplay">₹0</div>
  </div>

  <div class="form-row">
    <input type="text" id="descInput" placeholder="Description (e.g. Petrol)" />
    <input type="number" id="amountInput" placeholder="Amount" step="0.01" />
  </div>

  <div class="form-row">
    <button class="btn-add" id="addBtn">➕ Add Money</button>
    <button class="btn-deduct" id="deductBtn">➖ Deduct Money</button>
  </div>

  <div class="history">
    <h3>📜 Transaction History</h3>
    <div class="month-filter">
      <label for="monthSelect">Month:</label>
      <select id="monthSelect" onchange="onMonthChange()">
        <option value="">All History</option>
      </select>
    </div>
    <div class="monthly-summary" id="monthlySummary"></div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Edit Balance Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>Edit Balance</h2>
    <input type="number" id="newBalance" placeholder="New Balance" step="0.01" />
    <input type="password" id="password" placeholder="Enter Password" />
    <div class="modal-buttons">
      <button class="btn-save" id="saveBalanceBtn">Save</button>
      <button class="btn-cancel" id="cancelEditBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- Edit Transaction Modal -->
<div id="editTransactionModal" class="modal">
  <div class="modal-content">
    <h2>Edit Transaction</h2>
    <input type="text" id="editTransDesc" placeholder="Description" />
    <input type="number" id="editTransAmount" placeholder="Amount" step="0.01" />
    <div class="modal-buttons">
      <button class="btn-save" id="saveTransactionBtn">Save</button>
      <button class="btn-cancel" id="cancelTransactionBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'http://localhost:3000/api';
  let currentTransactions = [];

  async function fetchData() {
    try {
      const res = await fetch(`${API_URL}/data`);
      return await res.json();
    } catch (err) {
      console.error('Error fetching data:', err);
      alert('Unable to connect to server. Make sure it\'s running.');
      return { balance: 0, transactions: [] };
    }
  }

  async function postTransaction(type, amount, description) {
    const res = await fetch(`${API_URL}/transaction`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, amount, description })
    });
    return res.json();
  }

  async function updateBalance(newBalance, password) {
    const res = await fetch(`${API_URL}/update-balance`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newBalance, password })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || 'Failed to update balance');
    }
    return data;
  }

  let selectedMonth = null;

  function getMonthKey(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function getMonthLabel(key) {
    const [y, m] = key.split('-');
    return new Date(+y, +m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
  }

  function populateMonthOptions() {
    const select = document.getElementById('monthSelect');
    const months = [...new Set(currentTransactions
      .map(t => t.timestamp ? getMonthKey(t.timestamp) : null)
      .filter(Boolean))].sort().reverse();
    if (selectedMonth && !months.includes(selectedMonth)) selectedMonth = null;
    let html = `<option value="">All History</option>`;
    months.forEach(key => {
      const sel = selectedMonth === key ? 'selected' : '';
      html += `<option value="${key}" ${sel}>${getMonthLabel(key)}</option>`;
    });
    select.innerHTML = html;
  }

  function onMonthChange() {
    selectedMonth = document.getElementById('monthSelect').value || null;
    renderFiltered();
  }

  async function render() {
    const data = await fetchData();
    document.getElementById('balanceDisplay').textContent = `₹${data.balance.toFixed(2)}`;

    currentTransactions = data.transactions;
    if (selectedMonth === null) {
      selectedMonth = getMonthKey(new Date());
    }
    populateMonthOptions();
    renderFiltered();
  }

  function renderFiltered() {
    const list = document.getElementById('historyList');
    const filtered = selectedMonth
      ? currentTransactions.filter(t => t.timestamp && getMonthKey(t.timestamp) === selectedMonth)
      : currentTransactions;
    const monthLabel = selectedMonth ? getMonthLabel(selectedMonth) : 'All History';

    updateMonthlySummary(filtered, monthLabel);

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">No transactions for ${monthLabel}.</div>`;
      return;
    }

    list.innerHTML = filtered.map((t) => {
      let sign, cls;
      if (t.type === 'add') {
        sign = '+';
        cls = 'add';
      } else if (t.type === 'deduct') {
        sign = '-';
        cls = 'deduct';
      } else if (t.type === 'edit') {
        sign = t.amount >= 0 ? '+' : '';
        cls = 'edit';
      }
      
      const txDate = t.timestamp ? new Date(t.timestamp).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true }) : '';
      return `
        <div class="transaction">
          <div class="transaction-left">
            <span class="desc">${t.description || t.type}</span>
            <span class="tx-date">${txDate}</span>
          </div>
          <div class="transaction-right">
            <span class="amount ${cls}">${sign}₹${Math.abs(t.amount).toFixed(2)}</span>
            <button class="edit-btn" onclick="editTransaction(${t.id}, '${t.description}', ${t.amount}, '${t.type}')">✏️ Edit</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateMonthlySummary(transactions, monthLabel) {
    let added = 0, deducted = 0, count = transactions.length;
    transactions.forEach(t => {
      if (t.type === 'add') added += t.amount;
      else if (t.type === 'deduct') deducted += t.amount;
    });
    const summary = document.getElementById('monthlySummary');
    summary.innerHTML = `
      <div class="ms-item">
        <span class="ms-label">${monthLabel}</span>
        <span class="ms-total">${count}</span>
      </div>
      <div class="ms-item">
        <span class="ms-label">Added</span>
        <span class="ms-total add">+₹${added.toFixed(2)}</span>
      </div>
      <div class="ms-item">
        <span class="ms-label">Deducted</span>
        <span class="ms-total deduct">-₹${deducted.toFixed(2)}</span>
      </div>
      <div class="ms-item">
        <span class="ms-label">Net</span>
        <span class="ms-total net">${added - deducted >= 0 ? '+' : ''}₹${(added - deducted).toFixed(2)}</span>
      </div>
    `;
  }

  async function handleTransaction(type) {
    const desc = document.getElementById('descInput').value.trim() || type;
    const amount = parseFloat(document.getElementById('amountInput').value);
    if (!amount || amount <= 0) {
      alert('Please enter a valid amount.');
      return;
    }
    await postTransaction(type, amount, desc);
    document.getElementById('amountInput').value = '';
    document.getElementById('descInput').value = '';
    render();
  }

  function openEditModal() {
    document.getElementById('editModal').classList.add('active');
    document.getElementById('newBalance').focus();
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
    document.getElementById('newBalance').value = '';
    document.getElementById('password').value = '';
  }

  async function handleSaveBalance() {
    const newBalance = parseFloat(document.getElementById('newBalance').value);
    const password = document.getElementById('password').value;
    
    if (!newBalance || newBalance < 0) {
      alert('Please enter a valid balance.');
      return;
    }
    
    if (!password) {
      alert('Please enter password.');
      return;
    }

    try {
      await updateBalance(newBalance, password);
      closeEditModal();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  let editingTransactionId = null;

  function editTransaction(id, desc, amount, type) {
    editingTransactionId = id;
    document.getElementById('editTransDesc').value = desc;
    document.getElementById('editTransAmount').value = Math.abs(amount);
    document.getElementById('editTransactionModal').classList.add('active');
    document.getElementById('editTransDesc').focus();
  }

  function closeTransactionEditModal() {
    document.getElementById('editTransactionModal').classList.remove('active');
    document.getElementById('editTransDesc').value = '';
    document.getElementById('editTransAmount').value = '';
    editingTransactionId = null;
  }

  async function handleSaveTransaction() {
    if (editingTransactionId === null) return;

    const newDesc = document.getElementById('editTransDesc').value.trim();
    const newAmount = parseFloat(document.getElementById('editTransAmount').value);

    if (!newAmount || newAmount <= 0) {
      alert('Please enter a valid amount.');
      return;
    }

    try {
      const transaction = currentTransactions.find(t => t.id === editingTransactionId);
      if (!transaction) {
        alert('Transaction not found.');
        return;
      }

      // Delete old transaction
      await fetch(`${API_URL}/transaction/${transaction.id}`, { method: 'DELETE' });
      
      // Add new transaction with updated values
      await postTransaction(transaction.type, newAmount, newDesc);
      
      closeTransactionEditModal();
      render();
    } catch (err) {
      alert('Failed to update transaction: ' + err.message);
    }
  }

  // Event Listeners
  document.getElementById('addBtn').addEventListener('click', () => handleTransaction('add'));
  document.getElementById('deductBtn').addEventListener('click', () => handleTransaction('deduct'));
  document.getElementById('editBalanceBtn').addEventListener('click', openEditModal);
  document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);
  document.getElementById('saveBalanceBtn').addEventListener('click', handleSaveBalance);
  document.getElementById('cancelTransactionBtn').addEventListener('click', closeTransactionEditModal);
  document.getElementById('saveTransactionBtn').addEventListener('click', handleSaveTransaction);

  // Close modal when clicking outside
  document.getElementById('editModal').addEventListener('click', (e) => {
    if (e.target.id === 'editModal') closeEditModal();
  });
  
  document.getElementById('editTransactionModal').addEventListener('click', (e) => {
    if (e.target.id === 'editTransactionModal') closeTransactionEditModal();
  });

  render();
</script>

</body>
</html>
